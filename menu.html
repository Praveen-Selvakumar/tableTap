<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #faf8f4;

            color: #24211f;

            padding-bottom: 95px;
        }


        header {

            height: 64px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            border-bottom: 1px solid #eee9e3;

            position: sticky;

            top: 0;

            z-index: 10;
        }


        .back {

            font-size: 22px;

            text-decoration: none;

            color: #24211f;
        }


        .header-title {

            font-size: 18px;

            font-weight: bold;
        }


        .cart-icon {

            width: 40px;

            height: 40px;

            background: #f4efe9;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;
        }


        .restaurant-info {

            padding: 22px 20px 10px;
        }


        .restaurant-info h1 {

            font-size: 26px;
        }


        .restaurant-info p {

            margin-top: 7px;

            color: #777;

            font-size: 13px;

            line-height: 1.5;
        }


        .table-info {

            margin-top: 10px;

            display: inline-block;

            background: #f4efe9;

            padding: 7px 12px;

            border-radius: 10px;

            font-size: 12px;

            font-weight: 600;
        }


        .categories {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding: 15px 20px;

            scrollbar-width: none;
        }


        .categories::-webkit-scrollbar {

            display: none;
        }


        .category {

            flex-shrink: 0;

            padding: 9px 15px;

            border-radius: 20px;

            background: white;

            border: 1px solid #e6dfd8;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .category.active {

            background: #e85d04;

            color: white;

            border-color: #e85d04;
        }


        .menu-section {

            padding: 5px 20px;
        }


        .section-title {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 14px;
        }


        .loading {

            text-align: center;

            padding: 50px 20px;

            color: #888;

            font-size: 14px;
        }


        .error {

            display: none;

            margin: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #fff0ed;

            color: #c0392b;

            font-size: 13px;

            text-align: center;
        }


        .error.show {

            display: block;
        }


        .empty {

            display: none;

            text-align: center;

            padding: 50px 20px;

            color: #888;

            font-size: 14px;
        }


        .empty.show {

            display: block;
        }


        .food-card {

            background: white;

            border-radius: 18px;

            padding: 13px;

            margin-bottom: 12px;

            display: flex;

            gap: 13px;

            border: 1px solid #eee8e1;

            min-height: 125px;
        }


        .food-image {

            width: 105px;

            height: 105px;

            flex-shrink: 0;

            border-radius: 14px;

            object-fit: cover;

            background: #eee;
        }


        .food-details {

            flex: 1;

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }


        .food-name {

            font-size: 15px;

            font-weight: bold;
        }


        .food-description {

            font-size: 11px;

            color: #888;

            line-height: 1.4;

            margin-top: 5px;
        }


        .food-bottom {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 8px;
        }


        .price {

            font-size: 15px;

            font-weight: bold;
        }


        .quantity {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .quantity button {

            width: 30px;

            height: 30px;

            border: none;

            border-radius: 9px;

            background: #f1ebe4;

            color: #24211f;

            font-size: 18px;

            cursor: pointer;
        }


        .quantity button.plus {

            background: #e85d04;

            color: white;
        }


        .quantity span {

            min-width: 15px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }


        .order-bar {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            background: white;

            border-top: 1px solid #e5dfd8;

            padding: 12px 20px;

            z-index: 20;
        }


        .order-container {

            max-width: 520px;

            margin: auto;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .total {

            flex: 1;
        }


        .total-label {

            font-size: 11px;

            color: #888;
        }


        .total-price {

            font-size: 20px;

            font-weight: bold;

            margin-top: 3px;
        }


        .order-button {

            border: none;

            background: #e85d04;

            color: white;

            padding: 15px 22px;

            border-radius: 14px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .order-button:disabled {

            background: #cfc8c1;

            cursor: not-allowed;
        }


        @media (min-width: 700px) {

            body {

                background: #eeeae5;
            }


            main {

                max-width: 520px;

                margin: auto;

                background: #faf8f4;

                min-height: 100vh;
            }


            header {

                max-width: 520px;

                margin: auto;

                left: 0;

                right: 0;
            }


            .order-bar {

                background: transparent;

                border: none;
            }

        }

    </style>

</head>


<body>


<main>


    <header>

        <a
            href="#"
            class="back"
            id="backButton"
        >

            ←

        </a>


        <div
            class="header-title"
            id="headerTitle"
        >

            Menu

        </div>


        <div class="cart-icon">

            🛒

        </div>

    </header>



    <section class="restaurant-info">

        <h1 id="restaurantName">

            Loading...

        </h1>


        <p id="restaurantDescription">

            Loading menu...

        </p>


        <div
            class="table-info"
            id="tableInfo"
        >

            Table -

        </div>

    </section>



    <div
        class="categories"
        id="categories"
    >

    </div>



    <section class="menu-section">


        <div class="section-title">

            Menu

        </div>


        <div
            class="loading"
            id="loading"
        >

            Loading menu...

        </div>


        <div
            class="error"
            id="errorMessage"
        >

        </div>


        <div
            class="empty"
            id="emptyMessage"
        >

            No menu items available.

        </div>


        <div id="menuContainer">

        </div>


    </section>



    <div class="order-bar">

        <div class="order-container">


            <div class="total">

                <div class="total-label">

                    Total

                </div>


                <div
                    class="total-price"
                    id="total"
                >

                    ₹0

                </div>

            </div>



            <button
                class="order-button"
                id="orderButton"
                onclick="goToCart()"
                disabled
            >

                Order →

            </button>


        </div>

    </div>


</main>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    collection,
    getDocs,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import { db } from "./firebase.js";



/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const restaurantId =
    params.get("restaurantId");


const tableNumber =
    params.get("tableNumber");



/* =========================================================
   ELEMENTS
========================================================= */

const restaurantName =
    document.getElementById(
        "restaurantName"
    );


const restaurantDescription =
    document.getElementById(
        "restaurantDescription"
    );


const tableInfo =
    document.getElementById(
        "tableInfo"
    );


const menuContainer =
    document.getElementById(
        "menuContainer"
    );


const categoriesContainer =
    document.getElementById(
        "categories"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );


const totalElement =
    document.getElementById(
        "total"
    );


const orderButton =
    document.getElementById(
        "orderButton"
    );


const backButton =
    document.getElementById(
        "backButton"
    );



/* =========================================================
   CART
========================================================= */

let cart = {};



/* =========================================================
   MENU
========================================================= */

let menuItems = [];

let selectedCategory = "All";



/* =========================================================
   LOAD OLD CART
========================================================= */

const savedCart =
    localStorage.getItem(
        "tableTapCart"
    );


if (savedCart) {

    try {

        const parsedCart =
            JSON.parse(
                savedCart
            );


        if (
            parsedCart &&
            typeof parsedCart === "object" &&
            !Array.isArray(parsedCart)
        ) {

            cart = parsedCart;

        }

    } catch (error) {

        console.warn(
            "Invalid saved cart. Clearing it."
        );


        localStorage.removeItem(
            "tableTapCart"
        );


        cart = {};

    }

}



/* =========================================================
   VALIDATE URL
========================================================= */

if (!restaurantId) {

    showError(
        "Restaurant ID is missing."
    );

} else {


    if (tableNumber) {

        tableInfo.textContent =
            "Table " + tableNumber;

    }


    backButton.href =
        "index.html" +
        "?restaurantId=" +
        encodeURIComponent(
            restaurantId
        ) +
        "&tableNumber=" +
        encodeURIComponent(
            tableNumber || ""
        );


    loadRestaurant();

}



/* =========================================================
   LOAD RESTAURANT
========================================================= */

async function loadRestaurant() {

    try {

        const restaurantRef =
            doc(
                db,
                "restaurants",
                restaurantId
            );


        const snapshot =
            await getDoc(
                restaurantRef
            );


        if (snapshot.exists()) {

            const data =
                snapshot.data();


            restaurantName.textContent =
                data.restaurantName ||
                "Restaurant";


            restaurantDescription.textContent =
                data.description ||
                "Freshly prepared food served with care.";

        }


        await loadMyMenu();


    } catch (error) {

        console.error(
            "Restaurant loading error:",
            error
        );


        showError(
            "Unable to load restaurant."
        );

    }

}



/* =========================================================
   LOAD MY MENU
========================================================= */

async function loadMyMenu() {

    loading.style.display =
        "block";


    try {

        const myMenuRef =
            collection(
                db,
                "restaurants",
                restaurantId,
                "myMenu"
            );


        const snapshot =
            await getDocs(
                myMenuRef
            );


        menuItems = [];


        snapshot.forEach(
            document => {

                const data =
                    document.data();


                /*
                 * Only available items.
                 */

                const isAvailable =
                    data.isAvailable !== false;


                if (!isAvailable) {

                    return;

                }


                /*
                 * IMPORTANT:
                 *
                 * document.id is the
                 * ONLY canonical cart ID.
                 */

                menuItems.push({

                    id:
                        document.id,

                    name:
                        data.name ||
                        "Food Item",

                    description:
                        data.des ||
                        data.description ||
                        "",

                    price:
                        Number(
                            data.price || 0
                        ),

                    category:
                        data.category ||
                        "Other",

                    count:
                        Number(
                            data.count || 0
                        ),

                    image:
                        data.image ||
                        data.imageUrl ||
                        ""

                });

            }
        );


        console.log(
            "Current restaurant menu:",
            menuItems
        );



        /* =================================================
           CLEAN OLD CART
        ================================================= */

        cleanCartAgainstCurrentMenu();



        loading.style.display =
            "none";


        if (
            menuItems.length === 0
        ) {

            emptyMessage.classList.add(
                "show"
            );

            updateUI();

            return;

        }


        createCategories();

        renderMenu();

        updateUI();


    } catch (error) {

        console.error(
            "My Menu loading error:",
            error
        );


        loading.style.display =
            "none";


        showError(
            "Unable to load menu."
        );

    }

}



/* =========================================================
   CLEAN CART
========================================================= */

function cleanCartAgainstCurrentMenu() {

    /*
     * Build a Set containing only the
     * current Firestore document IDs.
     */

    const validMenuIds =
        new Set(
            menuItems.map(
                item => item.id
            )
        );


    let changed = false;


    /*
     * Remove anything from localStorage
     * that doesn't belong to this restaurant's
     * current myMenu.
     */

    Object.keys(cart).forEach(
        cartItemId => {

            if (
                !validMenuIds.has(
                    cartItemId
                )
            ) {

                console.warn(
                    "Removing stale cart item:",
                    cartItemId
                );


                delete cart[cartItemId];


                changed = true;

            }

        }
    );


    if (changed) {

        saveCart();

        console.log(
            "Cart cleaned successfully."
        );

    }

}



/* =========================================================
   CATEGORIES
========================================================= */

function createCategories() {

    categoriesContainer.innerHTML =
        "";


    const categories = [

        "All",

        ...new Set(
            menuItems
                .map(
                    item =>
                        item.category
                )
                .filter(Boolean)
        )

    ];


    categories.forEach(
        category => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "category" +
                (
                    category === "All"
                        ? " active"
                        : ""
                );


            element.textContent =
                formatCategory(
                    category
                );


            element.addEventListener(
                "click",
                () => {

                    selectedCategory =
                        category;


                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    element.classList.add(
                        "active"
                    );


                    renderMenu();

                }
            );


            categoriesContainer.appendChild(
                element
            );

        }
    );

}



/* =========================================================
   RENDER MENU
========================================================= */

function renderMenu() {

    menuContainer.innerHTML =
        "";


    const filteredItems =
        selectedCategory === "All"

            ? menuItems

            : menuItems.filter(
                item =>
                    item.category ===
                    selectedCategory
            );


    filteredItems.forEach(
        item => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "food-card";


            const image =
                item.image ||
                "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=300&q=80";


            const quantity =
                cart[item.id] || 0;


            card.innerHTML = `

                <img
                    class="food-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(item.name)}"
                    onerror="this.src='https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=300&q=80'"
                >


                <div class="food-details">


                    <div>

                        <div class="food-name">

                            ${escapeHtml(
                                item.name
                            )}

                        </div>


                        <div class="food-description">

                            ${escapeHtml(
                                item.description
                            )}

                        </div>

                    </div>



                    <div class="food-bottom">


                        <div class="price">

                            ₹${item.price}

                        </div>



                        <div class="quantity">


                            <button
                                onclick="removeItem('${escapeJs(item.id)}')"
                            >

                                −

                            </button>


                            <span
                                id="qty-${escapeHtml(item.id)}"
                            >

                                ${quantity}

                            </span>


                            <button
                                class="plus"
                                onclick="addItem('${escapeJs(item.id)}')"
                            >

                                +

                            </button>


                        </div>


                    </div>


                </div>

            `;


            menuContainer.appendChild(
                card
            );

        }
    );

}



/* =========================================================
   ADD ITEM
========================================================= */

window.addItem =
    function(id) {


        const item =
            menuItems.find(
                menuItem =>
                    menuItem.id === id
            );


        if (!item) {

            console.error(
                "Menu item not found:",
                id
            );

            return;

        }


        const currentQuantity =
            Number(
                cart[id] || 0
            );


        /*
         * Stock validation.
         *
         * Current rule:
         *
         * count > 0 = stock controlled
         * count = 0 = unlimited/unknown
         */

        if (

            item.count > 0 &&

            currentQuantity >=
            item.count

        ) {

            alert(
                "Only " +
                item.count +
                " available."
            );

            return;

        }


        cart[id] =
            currentQuantity + 1;


        saveCart();

        updateUI();

    };



/* =========================================================
   REMOVE ITEM
========================================================= */

window.removeItem =
    function(id) {


        if (!cart[id]) {

            return;

        }


        cart[id]--;


        if (
            cart[id] <= 0
        ) {

            delete cart[id];

        }


        saveCart();

        updateUI();

    };



/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    let total = 0;

    let itemCount = 0;


    menuItems.forEach(
        item => {


            const quantity =
                Number(
                    cart[item.id] || 0
                );


            const quantityElement =
                document.getElementById(
                    "qty-" +
                    item.id
                );


            if (
                quantityElement
            ) {

                quantityElement.innerText =
                    quantity;

            }


            total +=
                item.price *
                quantity;


            itemCount +=
                quantity;

        }
    );


    totalElement.innerText =
        "₹" + total;


    orderButton.disabled =
        itemCount === 0;

}



/* =========================================================
   SAVE CART
========================================================= */

function saveCart() {

    localStorage.setItem(

        "tableTapCart",

        JSON.stringify(
            cart
        )

    );


    localStorage.setItem(

        "tableTapRestaurantId",

        restaurantId

    );


    localStorage.setItem(

        "tableTapTableNumber",

        tableNumber || ""

    );

}



/* =========================================================
   GO TO CART
========================================================= */

window.goToCart =
    function() {


        if (
            Object.keys(cart).length === 0
        ) {

            return;

        }


        saveCart();


        window.location.href =
            "cart.html" +

            "?restaurantId=" +

            encodeURIComponent(
                restaurantId
            ) +

            "&tableNumber=" +

            encodeURIComponent(
                tableNumber || ""
            );

    };



/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorMessage.textContent =
        message;


    errorMessage.classList.add(
        "show"
    );

}



/* =========================================================
   CATEGORY FORMAT
========================================================= */

function formatCategory(category) {

    return category

        .replaceAll(
            "_",
            " "
        )

        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================================
   ESCAPE JAVASCRIPT
========================================================= */

function escapeJs(value) {

    return String(value)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        )

        .replaceAll(
            '"',
            '\\"'
        );

}

</script>


</body>

</html>
