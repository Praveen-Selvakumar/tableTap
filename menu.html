<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #faf8f4;

            color: #24211f;

            padding-bottom: 95px;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 64px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            border-bottom: 1px solid #eee9e3;

            position: sticky;

            top: 0;

            z-index: 10;
        }


        .back {

            font-size: 22px;

            text-decoration: none;

            color: #24211f;
        }


        .header-title {

            font-size: 18px;

            font-weight: bold;
        }


        .cart-icon {

            width: 40px;

            height: 40px;

            background: #f4efe9;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;
        }


        /* =========================
           RESTAURANT
        ========================= */

        .restaurant-info {

            padding: 22px 20px 10px;
        }


        .restaurant-info h1 {

            font-size: 26px;
        }


        .restaurant-info p {

            margin-top: 7px;

            color: #777;

            font-size: 13px;

            line-height: 1.5;
        }


        .table-info {

            margin-top: 10px;

            display: inline-block;

            background: #f4efe9;

            padding: 7px 12px;

            border-radius: 10px;

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================
           CATEGORIES
        ========================= */

        .categories {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding: 15px 20px;

            scrollbar-width: none;
        }


        .categories::-webkit-scrollbar {

            display: none;
        }


        .category {

            flex-shrink: 0;

            padding: 9px 15px;

            border-radius: 20px;

            background: white;

            border: 1px solid #e6dfd8;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .category.active {

            background: #e85d04;

            color: white;

            border-color: #e85d04;
        }


        /* =========================
           MENU
        ========================= */

        .menu-section {

            padding: 5px 20px;
        }


        .section-title {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 14px;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 50px 20px;

            color: #888;

            font-size: 14px;
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            display: none;

            margin: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #fff0ed;

            color: #c0392b;

            font-size: 13px;

            text-align: center;
        }


        .error.show {

            display: block;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            display: none;

            text-align: center;

            padding: 50px 20px;

            color: #888;

            font-size: 14px;
        }


        .empty.show {

            display: block;
        }


        /* =========================
           FOOD CARD
        ========================= */

        .food-card {

            background: white;

            border-radius: 18px;

            padding: 13px;

            margin-bottom: 12px;

            display: flex;

            gap: 13px;

            border: 1px solid #eee8e1;

            min-height: 125px;
        }


        .food-image {

            width: 105px;

            height: 105px;

            flex-shrink: 0;

            border-radius: 14px;

            object-fit: cover;

            background: #eee;
        }


        .food-details {

            flex: 1;

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }


        .food-name {

            font-size: 15px;

            font-weight: bold;
        }


        .food-description {

            font-size: 11px;

            color: #888;

            line-height: 1.4;

            margin-top: 5px;
        }


        .food-bottom {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 8px;
        }


        .price {

            font-size: 15px;

            font-weight: bold;
        }


        /* =========================
           QUANTITY
        ========================= */

        .quantity {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .quantity button {

            width: 30px;

            height: 30px;

            border: none;

            border-radius: 9px;

            background: #f1ebe4;

            color: #24211f;

            font-size: 18px;

            cursor: pointer;
        }


        .quantity button.plus {

            background: #e85d04;

            color: white;
        }


        .quantity span {

            min-width: 15px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           BOTTOM ORDER BAR
        ========================= */

        .order-bar {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            background: white;

            border-top: 1px solid #e5dfd8;

            padding: 12px 20px;

            z-index: 20;
        }


        .order-container {

            max-width: 520px;

            margin: auto;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .total {

            flex: 1;
        }


        .total-label {

            font-size: 11px;

            color: #888;
        }


        .total-price {

            font-size: 20px;

            font-weight: bold;

            margin-top: 3px;
        }


        .order-button {

            border: none;

            background: #e85d04;

            color: white;

            padding: 15px 22px;

            border-radius: 14px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .order-button:disabled {

            background: #cfc8c1;

            cursor: not-allowed;
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            body {

                background: #eeeae5;
            }


            main {

                max-width: 520px;

                margin: auto;

                background: #faf8f4;

                min-height: 100vh;
            }


            header {

                max-width: 520px;

                margin: auto;

                left: 0;

                right: 0;
            }


            .order-bar {

                background: transparent;

                border: none;
            }

        }

    </style>

</head>


<body>


<main>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <a
            href="#"
            class="back"
            id="backButton"
        >
            ←
        </a>


        <div
            class="header-title"
            id="headerTitle"
        >
            Menu
        </div>


        <div class="cart-icon">

            🛒

        </div>

    </header>



    <!-- =========================
         RESTAURANT
    ========================= -->

    <section class="restaurant-info">

        <h1 id="restaurantName">

            Loading...

        </h1>


        <p id="restaurantDescription">

            Loading menu...

        </p>


        <div
            class="table-info"
            id="tableInfo"
        >

            Table -

        </div>

    </section>



    <!-- =========================
         CATEGORIES
    ========================= -->

    <div
        class="categories"
        id="categories"
    >

        <!-- Categories generated dynamically -->

    </div>



    <!-- =========================
         MENU
    ========================= -->

    <section class="menu-section">


        <div class="section-title">

            Menu

        </div>


        <div
            class="loading"
            id="loading"
        >

            Loading menu...

        </div>


        <div
            class="error"
            id="errorMessage"
        >

        </div>


        <div
            class="empty"
            id="emptyMessage"
        >

            No menu items available.

        </div>


        <div id="menuContainer">

            <!-- Firestore items generated here -->

        </div>


    </section>



    <!-- =========================
         BOTTOM ORDER BAR
    ========================= -->

    <div class="order-bar">

        <div class="order-container">


            <div class="total">

                <div class="total-label">

                    Total

                </div>


                <div
                    class="total-price"
                    id="total"
                >

                    ₹0

                </div>

            </div>



            <button
                class="order-button"
                id="orderButton"
                onclick="goToCart()"
                disabled
            >

                Order →

            </button>


        </div>

    </div>


</main>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    collection,
    getDocs,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import { db } from "./firebase.js";



/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const restaurantId =
    params.get("restaurantId");


const tableNumber =
    params.get("tableNumber");



/* =========================================================
   ELEMENTS
========================================================= */

const restaurantName =
    document.getElementById(
        "restaurantName"
    );


const restaurantDescription =
    document.getElementById(
        "restaurantDescription"
    );


const tableInfo =
    document.getElementById(
        "tableInfo"
    );


const menuContainer =
    document.getElementById(
        "menuContainer"
    );


const categoriesContainer =
    document.getElementById(
        "categories"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );


const totalElement =
    document.getElementById(
        "total"
    );


const orderButton =
    document.getElementById(
        "orderButton"
    );


const backButton =
    document.getElementById(
        "backButton"
    );



/* =========================================================
   CART
========================================================= */

let cart = {};


/*
Restore previous cart if available
*/

const savedCart =
    localStorage.getItem(
        "tableTapCart"
    );


if (savedCart) {

    try {

        cart =
            JSON.parse(
                savedCart
            );

    } catch {

        cart = {};

    }

}



/* =========================================================
   MENU DATA
========================================================= */

let menuItems = [];

let selectedCategory = "All";



/* =========================================================
   URL VALIDATION
========================================================= */

if (!restaurantId) {

    showError(
        "Restaurant ID is missing."
    );

} else {

    if (tableNumber) {

        tableInfo.textContent =
            "Table " + tableNumber;

    }


    backButton.href =
        "index.html" +
        "?restaurantId=" +
        encodeURIComponent(
            restaurantId
        ) +
        "&tableNumber=" +
        encodeURIComponent(
            tableNumber || ""
        );


    loadRestaurant();

}



/* =========================================================
   LOAD RESTAURANT
========================================================= */

async function loadRestaurant() {

    try {

        const restaurantRef =
            doc(
                db,
                "restaurants",
                restaurantId
            );


        const snapshot =
            await getDoc(
                restaurantRef
            );


        if (snapshot.exists()) {

            const data =
                snapshot.data();


            restaurantName.textContent =
                data.restaurantName ||
                "Restaurant";


            restaurantDescription.textContent =
                data.description ||
                "Freshly prepared food served with care.";

        }


        await loadMyMenu();


    } catch (error) {

        console.error(
            "Restaurant loading error:",
            error
        );


        showError(
            "Unable to load restaurant."
        );

    }

}



/* =========================================================
   LOAD MY MENU
========================================================= */

async function loadMyMenu() {

    loading.style.display =
        "block";


    try {

        const myMenuRef =
            collection(
                db,
                "restaurants",
                restaurantId,
                "myMenu"
            );


        const snapshot =
            await getDocs(
                myMenuRef
            );


        menuItems = [];


        snapshot.forEach(
            document => {

                const data =
                    document.data();


                /*
                Only show available items
                */

                const isAvailable =
                    data.isAvailable !== false;


                if (!isAvailable) {

                    return;

                }


                menuItems.push({

                    id: document.id,

                    name:
                        data.name ||
                        "Food Item",

                    description:
                        data.des ||
                        data.description ||
                        "",

                    price:
                        Number(
                            data.price || 0
                        ),

                    category:
                        data.category ||
                        "Other",

                    count:
                        Number(
                            data.count || 0
                        ),

                    image:
                        data.image ||
                        data.imageUrl ||
                        ""

                });

            }
        );


        console.log(
            "My Menu:",
            menuItems
        );


        loading.style.display =
            "none";


        if (
            menuItems.length === 0
        ) {

            emptyMessage.classList.add(
                "show"
            );

            return;

        }


        createCategories();

        renderMenu();

        updateUI();


    } catch (error) {

        console.error(
            "My Menu loading error:",
            error
        );


        loading.style.display =
            "none";


        showError(
            "Unable to load menu."
        );

    }

}



/* =========================================================
   CREATE CATEGORIES
========================================================= */

function createCategories() {

    categoriesContainer.innerHTML = "";


    /*
    Get unique categories
    */

    const categories =
        [
            "All",
            ...new Set(
                menuItems
                    .map(item =>
                        item.category
                    )
                    .filter(Boolean)
            )
        ];


    categories.forEach(
        category => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "category" +
                (
                    category === "All"
                        ? " active"
                        : ""
                );


            element.textContent =
                formatCategory(
                    category
                );


            element.addEventListener(
                "click",
                () => {

                    selectedCategory =
                        category;


                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    element.classList.add(
                        "active"
                    );


                    renderMenu();

                }
            );


            categoriesContainer.appendChild(
                element
            );

        }
    );

}



/* =========================================================
   RENDER MENU
========================================================= */

function renderMenu() {

    menuContainer.innerHTML = "";


    const filteredItems =
        selectedCategory === "All"
            ? menuItems
            : menuItems.filter(
                item =>
                    item.category ===
                    selectedCategory
            );


    filteredItems.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "food-card";


            const image =
                item.image ||
                "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=300&q=80";


            const quantity =
                cart[item.id] || 0;


            card.innerHTML = `

                <img
                    class="food-image"
                    src="${image}"
                    alt="${escapeHtml(item.name)}"
                    onerror="this.src='https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=300&q=80'"
                >


                <div class="food-details">


                    <div>

                        <div class="food-name">

                            ${escapeHtml(item.name)}

                        </div>


                        <div class="food-description">

                            ${escapeHtml(
                                item.description
                            )}

                        </div>

                    </div>


                    <div class="food-bottom">


                        <div class="price">

                            ₹${item.price}

                        </div>


                        <div class="quantity">


                            <button
                                onclick="removeItem('${item.id}')"
                            >

                                −

                            </button>


                            <span
                                id="qty-${item.id}"
                            >

                                ${quantity}

                            </span>


                            <button
                                class="plus"
                                onclick="addItem('${item.id}')"
                            >

                                +

                            </button>


                        </div>


                    </div>


                </div>

            `;


            menuContainer.appendChild(
                card
            );

        }
    );

}



/* =========================================================
   ADD ITEM
========================================================= */

window.addItem =
    function(id) {

        const item =
            menuItems.find(
                menuItem =>
                    menuItem.id === id
            );


        if (!item) {

            return;

        }


        const currentQuantity =
            cart[id] || 0;


        /*
        Do not allow order quantity
        above available stock.
        */

        if (
            item.count > 0 &&
            currentQuantity >= item.count
        ) {

            alert(
                "Only " +
                item.count +
                " available."
            );

            return;

        }


        cart[id] =
            currentQuantity + 1;


        saveCart();

        updateUI();

    };



/* =========================================================
   REMOVE ITEM
========================================================= */

window.removeItem =
    function(id) {

        if (!cart[id]) {

            return;

        }


        cart[id]--;


        if (cart[id] <= 0) {

            delete cart[id];

        }


        saveCart();

        updateUI();

    };



/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    let total = 0;

    let itemCount = 0;


    menuItems.forEach(
        item => {

            const quantity =
                cart[item.id] || 0;


            const quantityElement =
                document.getElementById(
                    "qty-" + item.id
                );


            if (quantityElement) {

                quantityElement.innerText =
                    quantity;

            }


            total +=
                item.price *
                quantity;


            itemCount +=
                quantity;

        }
    );


    totalElement.innerText =
        "₹" + total;


    orderButton.disabled =
        itemCount === 0;

}



/* =========================================================
   SAVE CART
========================================================= */

function saveCart() {

    localStorage.setItem(

        "tableTapCart",

        JSON.stringify(cart)

    );


    /*
    Store restaurant/table information
    so cart.html knows where this order belongs.
    */

    localStorage.setItem(

        "tableTapRestaurantId",

        restaurantId

    );


    localStorage.setItem(

        "tableTapTableNumber",

        tableNumber || ""

    );

}



/* =========================================================
   GO TO CART
========================================================= */

window.goToCart =
    function() {

        if (
            Object.keys(cart).length === 0
        ) {

            return;

        }


        saveCart();


        window.location.href =
            "cart.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId
            ) +
            "&tableNumber=" +
            encodeURIComponent(
                tableNumber || ""
            );

    };



/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.classList.add(
        "show"
    );

}



/* =========================================================
   CATEGORY FORMAT
========================================================= */

function formatCategory(category) {

    return category
        .replaceAll("_", " ")
        .replace(/\b\w/g, char =>
            char.toUpperCase()
        );

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>


</body>

</html>
