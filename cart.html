<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - TableTap</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeae5;
            color: #211d1a;
        }

        main {
            max-width: 520px;
            min-height: 100vh;
            margin: auto;
            background: #faf8f4;
            padding-bottom: 110px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;

            height: 64px;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #211d1a;
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #e6a15c;
        }

        .back-button {
            border: none;
            background: transparent;
            color: white;

            font-size: 25px;
            cursor: pointer;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
        }

        .header-spacer {
            width: 30px;
        }

        .content {
            padding: 20px;
        }

        .restaurant-card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 18px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .restaurant-name {
            font-size: 20px;
            font-weight: bold;
        }

        .table-info {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0 12px;
        }

        .cart-item {
            display: flex;
            gap: 12px;

            background: white;
            padding: 14px;
            margin-bottom: 12px;

            border-radius: 16px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .item-image {
            width: 78px;
            height: 78px;

            border-radius: 12px;
            object-fit: cover;

            background: #eee;
            flex-shrink: 0;
        }

        .item-image-placeholder {
            width: 78px;
            height: 78px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f0ebe5;
            font-size: 30px;

            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-size: 16px;
            font-weight: bold;
        }

        .item-price {
            margin-top: 7px;
            font-size: 14px;
            color: #777;
        }

        .item-total {
            margin-top: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity-button {
            width: 30px;
            height: 30px;

            border: none;
            border-radius: 8px;

            background: #211d1a;
            color: white;

            font-size: 18px;
            cursor: pointer;
        }

        .quantity {
            min-width: 20px;
            text-align: center;
            font-weight: bold;
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            font-size: 22px;
        }

        .empty-cart p {
            margin-top: 8px;
            color: #777;
        }

        .browse-button {
            display: inline-block;

            margin-top: 22px;
            padding: 13px 22px;

            border-radius: 12px;

            background: #211d1a;
            color: white;

            text-decoration: none;
            font-weight: bold;
        }

        .warning {
            background: #fff3cd;
            color: #856404;

            border-radius: 12px;
            padding: 12px;

            margin-bottom: 15px;

            font-size: 14px;
        }

        .summary {
            background: white;
            border-radius: 18px;
            padding: 18px;

            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            margin-bottom: 12px;
            font-size: 15px;
        }

        .summary-row.total {
            border-top: 1px solid #eee;
            padding-top: 14px;

            font-size: 19px;
            font-weight: bold;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 100%;
            max-width: 520px;

            padding: 14px 18px;

            background: white;
            border-top: 1px solid #eee;

            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);

            z-index: 30;
        }

        .place-order-button {
            width: 100%;

            border: none;
            border-radius: 14px;

            padding: 16px;

            background: #211d1a;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .place-order-button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        .error {
            text-align: center;
            padding: 50px 20px;
            color: #c0392b;
        }

    </style>

</head>


<body>

<main>

    <!-- HEADER -->

    <header>

        <button
            class="back-button"
            onclick="goBack()"
        >
            ←
        </button>

        <div class="header-title">
            Your Cart
        </div>

        <div class="header-spacer"></div>

    </header>


    <!-- CONTENT -->

    <div class="content">

        <div id="loading" class="loading">
            Loading cart...
        </div>

        <div
            id="error"
            class="error"
            style="display:none;"
        >
            Unable to load cart.
        </div>

        <div
            id="cart-content"
            style="display:none;"
        >

            <!-- RESTAURANT -->

            <div class="restaurant-card">

                <div
                    id="restaurant-name"
                    class="restaurant-name"
                >
                    Restaurant
                </div>

                <div
                    id="table-info"
                    class="table-info"
                >
                    Table
                </div>

            </div>


            <!-- WARNING -->

            <div
                id="warning"
                class="warning"
                style="display:none;"
            ></div>


            <!-- ITEMS -->

            <div class="section-title">
                Your Items
            </div>

            <div id="cart-items"></div>


            <!-- SUMMARY -->

            <div
                id="summary"
                class="summary"
            >

                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span id="item-count">
                        0
                    </span>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span id="total">
                        ₹0
                    </span>

                </div>

            </div>

        </div>


        <!-- EMPTY CART -->

        <div
            id="empty-cart"
            class="empty-cart"
            style="display:none;"
        >

            <div class="empty-icon">
                🛒
            </div>

            <h2>
                Your cart is empty
            </h2>

            <p>
                Add some delicious food to continue.
            </p>

            <a
                id="browse-menu"
                class="browse-button"
                href="#"
            >
                Browse Menu
            </a>

        </div>

    </div>


    <!-- BOTTOM BAR -->

    <div
        id="bottom-bar"
        class="bottom-bar"
        style="display:none;"
    >

        <button
            id="place-order-button"
            class="place-order-button"
            onclick="placeOrder()"
        >
            Place Order
        </button>

    </div>

</main>


<script type="module">

    import { db } from "./firebase.js";

    import {
        doc,
        getDoc,
        collection,
        getDocs
    }
    from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ============================================================
    // URL PARAMETERS
    // ============================================================

    const params =
        new URLSearchParams(window.location.search);

    const restaurantId =
        params.get("restaurantId");

    const tableNumber =
        params.get("tableNumber");


    // ============================================================
    // CART
    // ============================================================

    let cart =
        JSON.parse(
            localStorage.getItem("tableTapCart")
        ) || {};


    let menuItems = [];


    // ============================================================
    // ELEMENTS
    // ============================================================

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const cartContent =
        document.getElementById("cart-content");

    const emptyCart =
        document.getElementById("empty-cart");

    const bottomBar =
        document.getElementById("bottom-bar");

    const cartItemsContainer =
        document.getElementById("cart-items");

    const restaurantName =
        document.getElementById("restaurant-name");

    const tableInfo =
        document.getElementById("table-info");

    const totalElement =
        document.getElementById("total");

    const itemCountElement =
        document.getElementById("item-count");

    const warning =
        document.getElementById("warning");

    const browseMenu =
        document.getElementById("browse-menu");


    // ============================================================
    // VALIDATE
    // ============================================================

    if (!restaurantId) {

        showError(
            "Restaurant information is missing."
        );

    } else {

        browseMenu.href =
            "menu.html?restaurantId=" +
            encodeURIComponent(restaurantId) +
            "&tableNumber=" +
            encodeURIComponent(tableNumber || "");

        loadCart();

    }


    // ============================================================
    // LOAD CART
    // ============================================================

    async function loadCart() {

        try {

            loading.style.display = "block";
            error.style.display = "none";


            // --------------------------------------------
            // RESTAURANT
            // --------------------------------------------

            const restaurantSnapshot =
                await getDoc(
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    )
                );


            if (restaurantSnapshot.exists()) {

                const data =
                    restaurantSnapshot.data();

                restaurantName.textContent =
                    data.name ||
                    "Restaurant";

            } else {

                restaurantName.textContent =
                    "Restaurant";

            }


            tableInfo.textContent =
                tableNumber
                    ? "Table " + tableNumber
                    : "Table";


            // --------------------------------------------
            // MENU
            // --------------------------------------------

            const menuSnapshot =
                await getDocs(
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "myMenu"
                    )
                );


            menuItems = [];


            menuSnapshot.forEach(
                (menuDocument) => {

                    const data =
                        menuDocument.data();


                    /*
                     * IMPORTANT:
                     *
                     * Firestore document.id
                     * is the ONLY canonical item ID.
                     *
                     * Do NOT use data.id here.
                     */

                    menuItems.push({

                        id: menuDocument.id,

                        name:
                            data.name ||
                            "Food Item",

                        description:
                            data.des ||
                            data.description ||
                            "",

                        price:
                            Number(
                                data.price || 0
                            ),

                        count:
                            Number(
                                data.count || 0
                            ),

                        image:
                            data.image ||
                            data.imageUrl ||
                            ""

                    });

                }
            );


            // --------------------------------------------
            // CLEAN INVALID CART ITEMS
            // --------------------------------------------

            cleanCart();


            loading.style.display = "none";


            if (
                Object.keys(cart).length === 0
            ) {

                showEmptyCart();

            } else {

                cartContent.style.display =
                    "block";

                bottomBar.style.display =
                    "block";

                renderCart();

            }

        } catch (e) {

            console.error(
                "Cart loading error:",
                e
            );

            showError(
                "Unable to load your cart."
            );

        }

    }


    // ============================================================
    // CLEAN CART
    // ============================================================

    function cleanCart() {

        let changed = false;


        Object.keys(cart).forEach(
            (cartItemId) => {

                const item =
                    menuItems.find(
                        menuItem =>
                            menuItem.id ===
                            cartItemId
                    );


                if (!item) {

                    delete cart[cartItemId];

                    changed = true;

                }

            }
        );


        if (changed) {

            saveCart();

        }

    }


    // ============================================================
    // RENDER CART
    // ============================================================

    function renderCart() {

        cartItemsContainer.innerHTML = "";


        let total = 0;
        let itemCount = 0;


        Object.entries(cart).forEach(
            ([id, quantity]) => {


                /*
                 * IMPORTANT:
                 *
                 * Only Firestore document.id
                 * is used for matching.
                 */

                const item =
                    menuItems.find(
                        menuItem =>
                            menuItem.id === id
                    );


                if (!item) {
                    return;
                }


                const safeQuantity =
                    Number(quantity);


                const itemTotal =
                    item.price *
                    safeQuantity;


                total += itemTotal;

                itemCount += safeQuantity;


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "cart-item";


                // IMAGE

                if (item.image) {

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.className =
                        "item-image";

                    image.src =
                        item.image;

                    image.alt =
                        item.name;

                    card.appendChild(image);

                } else {

                    const placeholder =
                        document.createElement(
                            "div"
                        );

                    placeholder.className =
                        "item-image-placeholder";

                    placeholder.textContent =
                        "🍽️";

                    card.appendChild(
                        placeholder
                    );

                }


                // DETAILS

                const details =
                    document.createElement(
                        "div"
                    );

                details.className =
                    "item-details";


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "item-name";

                name.textContent =
                    item.name;


                const price =
                    document.createElement(
                        "div"
                    );

                price.className =
                    "item-price";

                price.textContent =
                    "₹" + item.price;


                const itemTotalElement =
                    document.createElement(
                        "div"
                    );

                itemTotalElement.className =
                    "item-total";

                itemTotalElement.textContent =
                    "₹" + itemTotal;


                // QUANTITY

                const quantityRow =
                    document.createElement(
                        "div"
                    );

                quantityRow.className =
                    "quantity-row";


                const minus =
                    document.createElement(
                        "button"
                    );

                minus.className =
                    "quantity-button";

                minus.textContent =
                    "−";

                minus.onclick =
                    () => decreaseItem(id);


                const quantityText =
                    document.createElement(
                        "span"
                    );

                quantityText.className =
                    "quantity";

                quantityText.textContent =
                    safeQuantity;


                const plus =
                    document.createElement(
                        "button"
                    );

                plus.className =
                    "quantity-button";

                plus.textContent =
                    "+";

                plus.onclick =
                    () => increaseItem(id);


                quantityRow.appendChild(
                    minus
                );

                quantityRow.appendChild(
                    quantityText
                );

                quantityRow.appendChild(
                    plus
                );


                details.appendChild(
                    name
                );

                details.appendChild(
                    price
                );

                details.appendChild(
                    itemTotalElement
                );

                details.appendChild(
                    quantityRow
                );


                card.appendChild(
                    details
                );


                cartItemsContainer.appendChild(
                    card
                );

            }
        );


        totalElement.textContent =
            "₹" + total;


        itemCountElement.textContent =
            itemCount;


        if (
            Object.keys(cart).length === 0
        ) {

            showEmptyCart();

        }

    }


    // ============================================================
    // INCREASE
    // ============================================================

    window.increaseItem =
        function(id) {

            const item =
                menuItems.find(
                    menuItem =>
                        menuItem.id === id
                );


            if (!item) {
                return;
            }


            const currentQuantity =
                Number(
                    cart[id] || 0
                );


            /*
             * count = stock.
             *
             * count 0 means unlimited /
             * not stock-controlled.
             */

            if (
                item.count > 0 &&
                currentQuantity >= item.count
            ) {

                showWarning(
                    item.name +
                    " has only " +
                    item.count +
                    " available."
                );

                return;

            }


            cart[id] =
                currentQuantity + 1;


            saveCart();

            renderCart();

        };


    // ============================================================
    // DECREASE
    // ============================================================

    window.decreaseItem =
        function(id) {

            const currentQuantity =
                Number(
                    cart[id] || 0
                );


            if (
                currentQuantity <= 1
            ) {

                delete cart[id];

            } else {

                cart[id] =
                    currentQuantity - 1;

            }


            saveCart();

            renderCart();

        };


    // ============================================================
    // SAVE CART
    // ============================================================

    function saveCart() {

        localStorage.setItem(
            "tableTapCart",
            JSON.stringify(cart)
        );


        localStorage.setItem(
            "tableTapRestaurantId",
            restaurantId
        );


        localStorage.setItem(
            "tableTapTableNumber",
            tableNumber || ""
        );

    }


    // ============================================================
    // PLACE ORDER
    // ============================================================

    window.placeOrder =
        function() {

            if (
                Object.keys(cart).length === 0
            ) {

                return;

            }


            window.location.href =
                "order-confirmation.html" +
                "?restaurantId=" +
                encodeURIComponent(
                    restaurantId
                ) +
                "&tableNumber=" +
                encodeURIComponent(
                    tableNumber || ""
                );

        };


    // ============================================================
    // BACK
    // ============================================================

    window.goBack =
        function() {

            window.location.href =
                "menu.html" +
                "?restaurantId=" +
                encodeURIComponent(
                    restaurantId
                ) +
                "&tableNumber=" +
                encodeURIComponent(
                    tableNumber || ""
                );

        };


    // ============================================================
    // EMPTY
    // ============================================================

    function showEmptyCart() {

        loading.style.display =
            "none";

        cartContent.style.display =
            "none";

        bottomBar.style.display =
            "none";

        emptyCart.style.display =
            "block";

    }


    // ============================================================
    // ERROR
    // ============================================================

    function showError(message) {

        loading.style.display =
            "none";

        cartContent.style.display =
            "none";

        bottomBar.style.display =
            "none";

        emptyCart.style.display =
            "none";

        error.style.display =
            "block";

        error.textContent =
            message;

    }


    // ============================================================
    // WARNING
    // ============================================================

    function showWarning(message) {

        warning.textContent =
            message;

        warning.style.display =
            "block";


        setTimeout(
            () => {

                warning.style.display =
                    "none";

            },
            2500
        );

    }

</script>

</body>

</html>
