<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Cart - TableTap</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
            padding-bottom: 100px;
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 60px;
            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid #eeeeee;
        }

        .back-btn {
            border: none;
            background: none;

            font-size: 24px;
            cursor: pointer;

            width: 40px;
            height: 40px;
        }

        .header-title {
            font-size: 19px;
            font-weight: 700;
        }

        .header-spacer {
            width: 40px;
        }


        /* =========================
           MAIN
        ========================== */

        .container {
            max-width: 520px;
            margin: auto;
            padding: 18px 16px;
        }

        .restaurant-name {
            font-size: 14px;
            color: #777;
            margin-bottom: 18px;
        }


        /* =========================
           TABLE INFO
        ========================== */

        .table-card {
            background: #ffffff;

            border-radius: 14px;

            padding: 15px;

            margin-bottom: 18px;

            border: 1px solid #eeeeee;
        }

        .table-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .table-number {
            font-size: 17px;
            font-weight: 700;
        }


        /* =========================
           SECTION TITLE
        ========================== */

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }


        /* =========================
           CART ITEM
        ========================== */

        .cart-item {
            background: #ffffff;

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 12px;

            display: flex;
            align-items: center;

            gap: 12px;

            border: 1px solid #eeeeee;
        }

        .food-image {
            width: 65px;
            height: 65px;

            border-radius: 10px;

            object-fit: cover;

            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            min-width: 0;
        }

        .food-name {
            font-size: 15px;
            font-weight: 600;

            margin-bottom: 5px;
        }

        .food-price {
            font-size: 14px;
            color: #777;
        }


        /* =========================
           QUANTITY
        ========================== */

        .quantity-control {
            display: flex;
            align-items: center;

            border: 1px solid #dddddd;

            border-radius: 8px;

            overflow: hidden;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;

            border: none;

            background: #ffffff;

            font-size: 18px;

            cursor: pointer;
        }

        .quantity {
            width: 28px;

            text-align: center;

            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           ITEM TOTAL
        ========================== */

        .item-total {
            font-size: 14px;
            font-weight: 700;

            min-width: 55px;

            text-align: right;
        }


        /* =========================
           EMPTY CART
        ========================== */

        .empty-cart {
            background: #ffffff;

            border-radius: 14px;

            padding: 50px 20px;

            text-align: center;

            display: none;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .empty-text {
            color: #777;
            font-size: 14px;

            margin-bottom: 20px;
        }

        .browse-btn {
            display: inline-block;

            background: #111;
            color: white;

            padding: 12px 22px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           SUMMARY
        ========================== */

        .summary {
            background: #ffffff;

            border-radius: 14px;

            padding: 18px;

            margin-top: 20px;

            border: 1px solid #eeeeee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            font-size: 14px;

            margin-bottom: 12px;
        }

        .summary-label {
            color: #777;
        }

        .summary-value {
            font-weight: 600;
        }

        .divider {
            border: none;
            border-top: 1px solid #eeeeee;

            margin: 15px 0;
        }

        .total-row {
            display: flex;
            justify-content: space-between;

            font-size: 18px;
            font-weight: 700;
        }


        /* =========================
           BOTTOM BAR
        ========================== */

        .bottom-bar {
            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            background: #ffffff;

            border-top: 1px solid #eeeeee;

            padding: 12px 16px;

            z-index: 100;
        }

        .bottom-content {
            max-width: 520px;
            margin: auto;

            display: flex;
            align-items: center;

            gap: 12px;
        }

        .bottom-total {
            flex: 1;
        }

        .bottom-label {
            font-size: 12px;
            color: #777;
        }

        .bottom-price {
            font-size: 19px;
            font-weight: 700;
        }

        .place-order-btn {
            border: none;

            background: #111;
            color: #ffffff;

            padding: 14px 20px;

            border-radius: 10px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .place-order-btn:active {
            transform: scale(0.98);
        }


        /* =========================
           DESKTOP
        ========================== */

        @media (min-width: 600px) {

            body {
                background: #eeeeee;
            }

            .header {
                max-width: 520px;
                margin: auto;
            }

            .bottom-bar {
                background: transparent;
                border: none;
            }

        }

    </style>
</head>

<body>


<!-- =========================
     HEADER
========================== -->

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()">

        ←

    </button>

    <div class="header-title">
        Your Cart
    </div>

    <div class="header-spacer"></div>

</header>


<!-- =========================
     MAIN
========================== -->

<main class="container">

    <div class="restaurant-name">
        Sri Saravana Bhavan
    </div>


    <!-- TABLE -->

    <div class="table-card">

        <div class="table-label">
            Ordering for
        </div>

        <div class="table-number">
            Table 4
        </div>

    </div>


    <!-- CART -->

    <div id="cartSection">

        <div class="section-title">
            Your Order
        </div>

        <div id="cartItems"></div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-row">

                <span class="summary-label">
                    Items
                </span>

                <span
                    class="summary-value"
                    id="itemCount">

                    0

                </span>

            </div>


            <div class="summary-row">

                <span class="summary-label">
                    Subtotal
                </span>

                <span
                    class="summary-value"
                    id="subtotal">

                    ₹0

                </span>

            </div>


            <hr class="divider">


            <div class="total-row">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹0
                </span>

            </div>

        </div>

    </div>


    <!-- EMPTY CART -->

    <div
        class="empty-cart"
        id="emptyCart">

        <div class="empty-icon">
            🛒
        </div>

        <div class="empty-title">
            Your cart is empty
        </div>

        <div class="empty-text">
            Add some delicious food to your order.
        </div>

        <a
            href="menu.html"
            class="browse-btn">

            Browse Menu

        </a>

    </div>

</main>


<!-- =========================
     BOTTOM BAR
========================== -->

<div
    class="bottom-bar"
    id="bottomBar">

    <div class="bottom-content">

        <div class="bottom-total">

            <div class="bottom-label">
                Total
            </div>

            <div
                class="bottom-price"
                id="bottomTotal">

                ₹0

            </div>

        </div>

        <button
            class="place-order-btn"
            onclick="placeOrder()">

            Place Order →

        </button>

    </div>

</div>


<script>

    /* =========================
       MENU DATA
    ========================== */

    const menu = {

        dosa: {
            name: "Masala Dosa",
            price: 80,
            image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?auto=format&fit=crop&w=200&q=80"
        },

        idly: {
            name: "Idly",
            price: 50,
            image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=200&q=80"
        },

        briyani: {
            name: "Chicken Briyani",
            price: 180,
            image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=200&q=80"
        },

        parotta: {
            name: "Parotta",
            price: 60,
            image: "https://images.unsplash.com/photo-1628294895950-9805252327bc?auto=format&fit=crop&w=200&q=80"
        },

        coffee: {
            name: "Filter Coffee",
            price: 40,
            image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=200&q=80"
        }

    };


    /* =========================
       LOAD CART
    ========================== */

    let cart =
        JSON.parse(
            localStorage.getItem("tableTapCart")
        ) || {};


    /* =========================
       RENDER CART
    ========================== */

    function renderCart() {

        const cartItems =
            document.getElementById("cartItems");

        const emptyCart =
            document.getElementById("emptyCart");

        const cartSection =
            document.getElementById("cartSection");

        const bottomBar =
            document.getElementById("bottomBar");


        cartItems.innerHTML = "";


        let total = 0;
        let itemCount = 0;


        for (const id in cart) {

            const quantity = cart[id];

            if (
                !menu[id] ||
                quantity <= 0
            ) {
                continue;
            }


            const item = menu[id];

            const itemTotal =
                item.price * quantity;


            total += itemTotal;

            itemCount += quantity;


            const itemElement =
                document.createElement("div");

            itemElement.className =
                "cart-item";


            itemElement.innerHTML = `

                <img
                    class="food-image"
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="item-details">

                    <div class="food-name">
                        ${item.name}
                    </div>

                    <div class="food-price">
                        ₹${item.price}
                    </div>

                </div>


                <div class="quantity-control">

                    <button
                        class="quantity-btn"
                        onclick="decreaseItem('${id}')">

                        −

                    </button>

                    <div class="quantity">
                        ${quantity}
                    </div>

                    <button
                        class="quantity-btn"
                        onclick="increaseItem('${id}')">

                        +

                    </button>

                </div>


                <div class="item-total">

                    ₹${itemTotal}

                </div>

            `;


            cartItems.appendChild(itemElement);

        }


        /* =========================
           EMPTY CART
        ========================== */

        if (itemCount === 0) {

            cartSection.style.display =
                "none";

            emptyCart.style.display =
                "block";

            bottomBar.style.display =
                "none";

            return;

        }


        cartSection.style.display =
            "block";

        emptyCart.style.display =
            "none";

        bottomBar.style.display =
            "block";


        /* =========================
           TOTALS
        ========================== */

        document.getElementById("itemCount")
            .textContent = itemCount;

        document.getElementById("subtotal")
            .textContent = `₹${total}`;

        document.getElementById("total")
            .textContent = `₹${total}`;

        document.getElementById("bottomTotal")
            .textContent = `₹${total}`;

    }


    /* =========================
       INCREASE
    ========================== */

    function increaseItem(id) {

        if (!cart[id]) {
            cart[id] = 0;
        }

        cart[id]++;

        saveCart();

    }


    /* =========================
       DECREASE
    ========================== */

    function decreaseItem(id) {

        if (!cart[id]) {
            return;
        }

        cart[id]--;


        if (cart[id] <= 0) {
            delete cart[id];
        }

        saveCart();

    }


    /* =========================
       SAVE CART
    ========================== */

    function saveCart() {

        localStorage.setItem(
            "tableTapCart",
            JSON.stringify(cart)
        );

        renderCart();

    }


    /* =========================
       PLACE ORDER
    ========================== */

    function placeOrder() {

        if (
            Object.keys(cart).length === 0
        ) {
            return;
        }


        /*
         * For now we simply save the
         * order and move to confirmation.
         */

        const order = {

            orderId:
                "TT" +
                Date.now(),

            tableNumber: 4,

            items: cart,

            createdAt:
                new Date().toISOString()

        };


        localStorage.setItem(
            "tableTapOrder",
            JSON.stringify(order)
        );


        window.location.href =
            "order-confirmation.html";

    }


    /* =========================
       BACK
    ========================== */

    function goBack() {

        window.location.href =
            "menu.html";

    }


    /* =========================
       INITIAL LOAD
    ========================== */

    renderCart();

</script>

</body>
</html>
