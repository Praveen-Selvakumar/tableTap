<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Cart - TableTap</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f7f7f7;

            color: #222;

            padding-bottom: 100px;
        }


        /* =========================
           HEADER
        ========================== */

        .header {

            position: sticky;

            top: 0;

            z-index: 100;

            height: 60px;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid #eeeeee;
        }


        .back-btn {

            border: none;

            background: none;

            font-size: 24px;

            cursor: pointer;

            width: 40px;

            height: 40px;
        }


        .header-title {

            font-size: 19px;

            font-weight: 700;
        }


        .header-spacer {

            width: 40px;
        }


        /* =========================
           MAIN
        ========================== */

        .container {

            max-width: 520px;

            margin: auto;

            padding: 18px 16px;
        }


        .restaurant-name {

            font-size: 14px;

            color: #777;

            margin-bottom: 18px;
        }


        /* =========================
           TABLE INFO
        ========================== */

        .table-card {

            background: #ffffff;

            border-radius: 14px;

            padding: 15px;

            margin-bottom: 18px;

            border: 1px solid #eeeeee;
        }


        .table-label {

            font-size: 12px;

            color: #777;

            margin-bottom: 5px;
        }


        .table-number {

            font-size: 17px;

            font-weight: 700;
        }


        /* =========================
           SECTION TITLE
        ========================== */

        .section-title {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {

            text-align: center;

            padding: 50px 20px;

            color: #777;

            font-size: 14px;
        }


        /* =========================
           ERROR
        ========================== */

        .error {

            display: none;

            background: #fff0ed;

            color: #c0392b;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 15px;

            font-size: 13px;

            text-align: center;
        }


        .error.show {

            display: block;
        }


        /* =========================
           CART ITEM
        ========================== */

        .cart-item {

            background: #ffffff;

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 12px;

            display: flex;

            align-items: center;

            gap: 12px;

            border: 1px solid #eeeeee;
        }


        .food-image {

            width: 65px;

            height: 65px;

            border-radius: 10px;

            object-fit: cover;

            flex-shrink: 0;

            background: #eeeeee;
        }


        .item-details {

            flex: 1;

            min-width: 0;
        }


        .food-name {

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 5px;
        }


        .food-price {

            font-size: 14px;

            color: #777;
        }


        /* =========================
           QUANTITY
        ========================== */

        .quantity-control {

            display: flex;

            align-items: center;

            border: 1px solid #dddddd;

            border-radius: 8px;

            overflow: hidden;
        }


        .quantity-btn {

            width: 30px;

            height: 30px;

            border: none;

            background: #ffffff;

            font-size: 18px;

            cursor: pointer;
        }


        .quantity {

            width: 28px;

            text-align: center;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           ITEM TOTAL
        ========================== */

        .item-total {

            font-size: 14px;

            font-weight: 700;

            min-width: 55px;

            text-align: right;
        }


        /* =========================
           EMPTY CART
        ========================== */

        .empty-cart {

            background: #ffffff;

            border-radius: 14px;

            padding: 50px 20px;

            text-align: center;

            display: none;
        }


        .empty-icon {

            font-size: 45px;

            margin-bottom: 15px;
        }


        .empty-title {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .empty-text {

            color: #777;

            font-size: 14px;

            margin-bottom: 20px;
        }


        .browse-btn {

            display: inline-block;

            background: #111;

            color: white;

            padding: 12px 22px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           SUMMARY
        ========================== */

        .summary {

            background: #ffffff;

            border-radius: 14px;

            padding: 18px;

            margin-top: 20px;

            border: 1px solid #eeeeee;
        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            font-size: 14px;

            margin-bottom: 12px;
        }


        .summary-label {

            color: #777;
        }


        .summary-value {

            font-weight: 600;
        }


        .divider {

            border: none;

            border-top: 1px solid #eeeeee;

            margin: 15px 0;
        }


        .total-row {

            display: flex;

            justify-content: space-between;

            font-size: 18px;

            font-weight: 700;
        }


        /* =========================
           BOTTOM BAR
        ========================== */

        .bottom-bar {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            background: #ffffff;

            border-top: 1px solid #eeeeee;

            padding: 12px 16px;

            z-index: 100;
        }


        .bottom-content {

            max-width: 520px;

            margin: auto;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .bottom-total {

            flex: 1;
        }


        .bottom-label {

            font-size: 12px;

            color: #777;
        }


        .bottom-price {

            font-size: 19px;

            font-weight: 700;
        }


        .place-order-btn {

            border: none;

            background: #111;

            color: #ffffff;

            padding: 14px 20px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .place-order-btn:disabled {

            background: #cccccc;

            cursor: not-allowed;
        }


        /* =========================
           DESKTOP
        ========================== */

        @media (min-width: 600px) {

            body {

                background: #eeeeee;
            }


            .header {

                max-width: 520px;

                margin: auto;
            }


            .bottom-bar {

                background: transparent;

                border: none;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================== -->

<header class="header">


    <button
        class="back-btn"
        id="backButton">

        ←

    </button>


    <div class="header-title">

        Your Cart

    </div>


    <div class="header-spacer"></div>


</header>



<!-- =========================
     MAIN
========================== -->

<main class="container">


    <div
        class="restaurant-name"
        id="restaurantName">

        Loading...

    </div>



    <!-- TABLE -->

    <div class="table-card">


        <div class="table-label">

            Ordering for

        </div>


        <div
            class="table-number"
            id="tableNumber">

            Table -

        </div>


    </div>



    <!-- ERROR -->

    <div
        class="error"
        id="errorMessage">

    </div>



    <!-- LOADING -->

    <div
        class="loading"
        id="loading">

        Loading your cart...

    </div>



    <!-- CART -->

    <div id="cartSection"
         style="display:none;">


        <div class="section-title">

            Your Order

        </div>


        <div id="cartItems"></div>



        <!-- SUMMARY -->

        <div class="summary">


            <div class="summary-row">

                <span class="summary-label">

                    Items

                </span>


                <span
                    class="summary-value"
                    id="itemCount">

                    0

                </span>

            </div>



            <div class="summary-row">

                <span class="summary-label">

                    Subtotal

                </span>


                <span
                    class="summary-value"
                    id="subtotal">

                    ₹0

                </span>

            </div>



            <hr class="divider">



            <div class="total-row">

                <span>

                    Total

                </span>


                <span id="total">

                    ₹0

                </span>

            </div>


        </div>


    </div>



    <!-- EMPTY CART -->

    <div
        class="empty-cart"
        id="emptyCart">


        <div class="empty-icon">

            🛒

        </div>


        <div class="empty-title">

            Your cart is empty

        </div>


        <div class="empty-text">

            Add some delicious food to your order.

        </div>


        <a
            href="#"
            class="browse-btn"
            id="browseButton">

            Browse Menu

        </a>


    </div>


</main>



<!-- =========================
     BOTTOM BAR
========================== -->

<div
    class="bottom-bar"
    id="bottomBar"
    style="display:none;">


    <div class="bottom-content">


        <div class="bottom-total">


            <div class="bottom-label">

                Total

            </div>


            <div
                class="bottom-price"
                id="bottomTotal">

                ₹0

            </div>


        </div>



        <button
            class="place-order-btn"
            id="placeOrderButton"
            onclick="placeOrder()">

            Place Order →

        </button>


    </div>


</div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {

    collection,

    getDocs,

    doc,

    getDoc

} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import { db } from "./firebase.js";



/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const restaurantId =
    params.get("restaurantId");


const tableNumber =
    params.get("tableNumber");



/* =========================================================
   ELEMENTS
========================================================= */

const restaurantName =
    document.getElementById(
        "restaurantName"
    );


const tableNumberElement =
    document.getElementById(
        "tableNumber"
    );


const cartSection =
    document.getElementById(
        "cartSection"
    );


const cartItemsElement =
    document.getElementById(
        "cartItems"
    );


const emptyCart =
    document.getElementById(
        "emptyCart"
    );


const loading =
    document.getElementById(
        "loading"
    );


const bottomBar =
    document.getElementById(
        "bottomBar"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const placeOrderButton =
    document.getElementById(
        "placeOrderButton"
    );


/* =========================================================
   CART
========================================================= */

let cart =
    JSON.parse(
        localStorage.getItem(
            "tableTapCart"
        )
    ) || {};


/* =========================================================
   FIRESTORE MENU
========================================================= */

let menuItems = [];



/* =========================================================
   INITIAL
========================================================= */

if (!restaurantId) {

    showError(
        "Restaurant information is missing."
    );

} else {

    if (tableNumber) {

        tableNumberElement.textContent =
            "Table " + tableNumber;

    }


    setupNavigation();

    loadCart();

}



/* =========================================================
   NAVIGATION
========================================================= */

function setupNavigation() {


    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "menu.html" +
                    "?restaurantId=" +
                    encodeURIComponent(
                        restaurantId
                    ) +
                    "&tableNumber=" +
                    encodeURIComponent(
                        tableNumber || ""
                    );

            }
        );


    document
        .getElementById("browseButton")
        .addEventListener(
            "click",
            event => {

                event.preventDefault();


                window.location.href =
                    "menu.html" +
                    "?restaurantId=" +
                    encodeURIComponent(
                        restaurantId
                    ) +
                    "&tableNumber=" +
                    encodeURIComponent(
                        tableNumber || ""
                    );

            }
        );

}



/* =========================================================
   LOAD CART
========================================================= */

async function loadCart() {

    loading.style.display =
        "block";


    try {


        /* =========================================
           LOAD RESTAURANT
        ========================================= */

        const restaurantRef =
            doc(
                db,
                "restaurants",
                restaurantId
            );


        const restaurantSnapshot =
            await getDoc(
                restaurantRef
            );


        if (
            restaurantSnapshot.exists()
        ) {

            const restaurant =
                restaurantSnapshot.data();


            restaurantName.textContent =
                restaurant.restaurantName ||
                "Restaurant";

        } else {

            restaurantName.textContent =
                "Restaurant";

        }



        /* =========================================
           CHECK CART
        ========================================= */

        if (
            Object.keys(cart).length === 0
        ) {

            showEmptyCart();

            return;

        }



        /* =========================================
           LOAD MY MENU
        ========================================= */

        const myMenuRef =
            collection(
                db,
                "restaurants",
                restaurantId,
                "myMenu"
            );


        const snapshot =
            await getDocs(
                myMenuRef
            );


        menuItems = [];


        snapshot.forEach(
            document => {

                const data =
                    document.data();


                menuItems.push({

                    id:
                        document.id,

                    name:
                        data.name ||
                        "Food Item",

                    description:
                        data.des ||
                        data.description ||
                        "",

                    price:
                        Number(
                            data.price || 0
                        ),

                    count:
                        Number(
                            data.count || 0
                        ),

                    image:
                        data.image ||
                        data.imageUrl ||
                        ""

                });

            }
        );


        console.log(
            "Cart menu items:",
            menuItems
        );


        renderCart();


    } catch (error) {

        console.error(
            "Cart loading error:",
            error
        );


        showError(
            "Unable to load your cart."
        );

    } finally {

        loading.style.display =
            "none";

    }

}



/* =========================================================
   RENDER CART
========================================================= */

function renderCart() {

    cartItemsElement.innerHTML = "";


    let total = 0;

    let itemCount = 0;

    let validItems = 0;



    Object.keys(cart).forEach(
        id => {

            const quantity =
                Number(cart[id]);


            if (quantity <= 0) {

                return;

            }


            const item =
                menuItems.find(
                    menuItem =>
                        menuItem.id === id
                );


            /*
            Item no longer exists
            in restaurant menu.
            */

            if (!item) {

                return;

            }


            validItems++;


            const itemTotal =
                item.price *
                quantity;


            total +=
                itemTotal;


            itemCount +=
                quantity;



            const itemElement =
                document.createElement(
                    "div"
                );


            itemElement.className =
                "cart-item";


            const image =
                item.image ||
                "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=200&q=80";


            itemElement.innerHTML = `

                <img
                    class="food-image"
                    src="${image}"
                    alt="${escapeHtml(
                        item.name
                    )}"
                    onerror="this.src='https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=200&q=80'"
                >


                <div class="item-details">

                    <div class="food-name">

                        ${escapeHtml(
                            item.name
                        )}

                    </div>


                    <div class="food-price">

                        ₹${item.price}

                    </div>

                </div>


                <div class="quantity-control">


                    <button
                        class="quantity-btn"
                        onclick="decreaseItem('${id}')">

                        −

                    </button>


                    <div class="quantity">

                        ${quantity}

                    </div>


                    <button
                        class="quantity-btn"
                        onclick="increaseItem('${id}')">

                        +

                    </button>


                </div>


                <div class="item-total">

                    ₹${itemTotal}

                </div>

            `;


            cartItemsElement.appendChild(
                itemElement
            );

        }
    );



    /* =====================================================
       EMPTY
    ===================================================== */

    if (validItems === 0) {

        showEmptyCart();

        return;

    }



    cartSection.style.display =
        "block";


    emptyCart.style.display =
        "none";


    bottomBar.style.display =
        "block";



    /* =====================================================
       TOTALS
    ===================================================== */

    document.getElementById(
        "itemCount"
    ).textContent =
        itemCount;


    document.getElementById(
        "subtotal"
    ).textContent =
        "₹" + total;


    document.getElementById(
        "total"
    ).textContent =
        "₹" + total;


    document.getElementById(
        "bottomTotal"
    ).textContent =
        "₹" + total;


    placeOrderButton.disabled =
        false;

}



/* =========================================================
   INCREASE
========================================================= */

window.increaseItem =
    function(id) {


        const item =
            menuItems.find(
                menuItem =>
                    menuItem.id === id
            );


        if (!item) {

            return;

        }


        const currentQuantity =
            cart[id] || 0;


        /*
        Do not exceed stock.
        */

        if (
            item.count > 0 &&
            currentQuantity >= item.count
        ) {

            alert(
                "Only " +
                item.count +
                " available."
            );

            return;

        }


        cart[id] =
            currentQuantity + 1;


        saveCart();

    };



/* =========================================================
   DECREASE
========================================================= */

window.decreaseItem =
    function(id) {


        if (!cart[id]) {

            return;

        }


        cart[id]--;


        if (cart[id] <= 0) {

            delete cart[id];

        }


        saveCart();

    };



/* =========================================================
   SAVE CART
========================================================= */

function saveCart() {

    localStorage.setItem(

        "tableTapCart",

        JSON.stringify(cart)

    );


    localStorage.setItem(

        "tableTapRestaurantId",

        restaurantId

    );


    localStorage.setItem(

        "tableTapTableNumber",

        tableNumber || ""

    );


    renderCart();

}



/* =========================================================
   PLACE ORDER
========================================================= */

window.placeOrder =
    function() {


        if (
            Object.keys(cart).length === 0
        ) {

            return;

        }


        /*
        We are NOT creating the Firestore
        order yet.

        Next step:
        create:

        restaurants/{restaurantId}/orders/{orderId}

        */

        const orderData = {

            restaurantId:
                restaurantId,

            tableNumber:
                Number(
                    tableNumber || 0
                ),

            items:
                cart,

            createdAt:
                Date.now()

        };


        localStorage.setItem(

            "tableTapOrder",

            JSON.stringify(
                orderData
            )

        );


        /*
        Temporary navigation.
        */

        window.location.href =
            "order-confirmation.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId
            ) +
            "&tableNumber=" +
            encodeURIComponent(
                tableNumber || ""
            );

    };



/* =========================================================
   EMPTY CART
========================================================= */

function showEmptyCart() {

    cartSection.style.display =
        "none";


    emptyCart.style.display =
        "block";


    bottomBar.style.display =
        "none";

}



/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorMessage.textContent =
        message;


    errorMessage.classList.add(
        "show"
    );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>


</body>

</html>
