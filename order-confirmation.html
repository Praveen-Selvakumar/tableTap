<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmation - TableTap</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeae5;
            color: #211d1a;
        }

        main {
            max-width: 520px;
            min-height: 100vh;

            margin: auto;

            background: #faf8f4;

            padding-bottom: 30px;
        }

        header {
            height: 64px;

            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #211d1a;
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #e6a15c;
        }

        .content {
            padding: 20px;
        }

        .success-card {
            background: white;

            border-radius: 20px;

            padding: 28px 20px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.05);
        }

        .success-icon {
            width: 75px;
            height: 75px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e7f5e8;

            font-size: 38px;
        }

        .success-card h1 {
            margin-top: 18px;

            font-size: 25px;
        }

        .success-card p {
            margin-top: 8px;

            color: #777;

            font-size: 14px;
        }

        .order-id {
            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #f5f1ec;
        }

        .order-id-label {
            font-size: 12px;
            color: #777;
        }

        .order-id-value {
            margin-top: 5px;

            font-size: 22px;
            font-weight: bold;
        }

        .info-card {
            margin-top: 15px;

            background: white;

            border-radius: 18px;

            padding: 18px;
        }

        .info-row {
            display: flex;

            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #777;
            font-size: 14px;
        }

        .info-value {
            font-weight: bold;
            font-size: 14px;
        }

        .section-title {
            margin-top: 22px;
            margin-bottom: 12px;

            font-size: 19px;
            font-weight: bold;
        }

        .order-item {
            display: flex;

            justify-content: space-between;

            background: white;

            padding: 14px;

            border-radius: 14px;

            margin-bottom: 10px;
        }

        .order-item-name {
            font-weight: bold;
        }

        .order-item-quantity {
            margin-top: 5px;

            font-size: 13px;
            color: #777;
        }

        .order-item-price {
            font-weight: bold;
        }

        .total-card {
            margin-top: 15px;

            padding: 18px;

            border-radius: 18px;

            background: #211d1a;
            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .total-label {
            font-size: 15px;
        }

        .total-value {
            font-size: 21px;
            font-weight: bold;
        }

        .button {
            display: block;

            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border-radius: 14px;

            text-align: center;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;
        }

        .primary-button {
            background: #211d1a;
            color: white;
        }

        .secondary-button {
            background: white;
            color: #211d1a;

            border: 1px solid #ddd;
        }

        .loading {
            text-align: center;

            padding: 70px 20px;

            color: #777;
        }

        .error-card {
            background: white;

            border-radius: 18px;

            padding: 30px 20px;

            text-align: center;
        }

        .error-card h2 {
            font-size: 21px;
        }

        .error-message {
            margin-top: 10px;

            color: #c0392b;

            font-size: 14px;
        }

    </style>

</head>


<body>

<main>

    <!-- HEADER -->

    <header>

        <div class="logo">
            Table<span>Tap</span>
        </div>

    </header>


    <div class="content">

        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >
            Placing your order...
        </div>


        <!-- SUCCESS -->

        <div
            id="success"
            style="display:none;"
        >

            <div class="success-card">

                <div class="success-icon">
                    ✓
                </div>

                <h1>
                    Order Placed!
                </h1>

                <p>
                    Your order has been sent to the restaurant.
                </p>


                <div class="order-id">

                    <div class="order-id-label">
                        ORDER ID
                    </div>

                    <div
                        id="order-id"
                        class="order-id-value"
                    >
                        TK-A123
                    </div>

                </div>

            </div>


            <!-- INFO -->

            <div class="info-card">

                <div class="info-row">

                    <span class="info-label">
                        Restaurant
                    </span>

                    <span
                        id="restaurant-name"
                        class="info-value"
                    >
                        Restaurant
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Table
                    </span>

                    <span
                        id="table-number"
                        class="info-value"
                    >
                        -
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Status
                    </span>

                    <span class="info-value">
                        Order Received
                    </span>

                </div>

            </div>


            <!-- ITEMS -->

            <div class="section-title">
                Order Items
            </div>

            <div id="order-items"></div>


            <!-- TOTAL -->

            <div class="total-card">

                <span class="total-label">
                    Total Amount
                </span>

                <span
                    id="total"
                    class="total-value"
                >
                    ₹0
                </span>

            </div>


            <!-- BUTTONS -->

            <a
                id="order-more-button"
                class="button primary-button"
                href="#"
            >
                Order More Food
            </a>


            <a
                id="back-home-button"
                class="button secondary-button"
                href="#"
            >
                Back to Restaurant
            </a>

        </div>


        <!-- ERROR -->

        <div
            id="error"
            class="error-card"
            style="display:none;"
        >

            <h2>
                Unable to place order
            </h2>

            <p
                id="error-message"
                class="error-message"
            >
                Something went wrong.
            </p>


            <a
                id="back-cart-button"
                class="button primary-button"
                href="#"
            >
                Back to Cart
            </a>

        </div>

    </div>

</main>


<script type="module">

    import { db } from "./firebase.js";


    import {
        collection,
        getDocs,
        doc,
        getDoc,
        setDoc
    }
    from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ============================================================
    // URL PARAMETERS
    // ============================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const restaurantId =
        params.get("restaurantId");


    const tableNumber =
        params.get("tableNumber");


    // ============================================================
    // CART
    // ============================================================

    let cart =
        JSON.parse(
            localStorage.getItem(
                "tableTapCart"
            )
        ) || {};


    let menuItems = [];


    // ============================================================
    // ELEMENTS
    // ============================================================

    const loading =
        document.getElementById(
            "loading"
        );


    const success =
        document.getElementById(
            "success"
        );


    const error =
        document.getElementById(
            "error"
        );


    const errorMessage =
        document.getElementById(
            "error-message"
        );


    // ============================================================
    // START
    // ============================================================

    placeOrder();


    // ============================================================
    // PLACE ORDER
    // ============================================================

    async function placeOrder() {

        try {

            if (!restaurantId) {

                throw new Error(
                    "Restaurant information is missing."
                );

            }


            if (!tableNumber) {

                throw new Error(
                    "Table number is missing."
                );

            }


            if (
                Object.keys(cart).length === 0
            ) {

                throw new Error(
                    "Your cart is empty."
                );

            }


            // ====================================================
            // RESTAURANT
            // ====================================================

            const restaurantSnapshot =
                await getDoc(
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    )
                );


            if (!restaurantSnapshot.exists()) {

                throw new Error(
                    "Restaurant not found."
                );

            }


            const restaurantData =
                restaurantSnapshot.data();


            document.getElementById(
                "restaurant-name"
            ).textContent =
                restaurantData.name ||
                "Restaurant";


            document.getElementById(
                "table-number"
            ).textContent =
                tableNumber;


            // ====================================================
            // LOAD MENU
            // ====================================================

            const menuSnapshot =
                await getDocs(
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "myMenu"
                    )
                );


            menuItems = [];


            menuSnapshot.forEach(
                (menuDocument) => {

                    const data =
                        menuDocument.data();


                    /*
                     * IMPORTANT:
                     *
                     * Firestore document.id
                     * is the ONLY canonical ID.
                     *
                     * data.id is NOT used.
                     */

                    menuItems.push({

                        id:
                            menuDocument.id,

                        name:
                            data.name ||
                            "Food Item",

                        price:
                            Number(
                                data.price || 0
                            ),

                        count:
                            Number(
                                data.count || 0
                            )

                    });

                }
            );


            // ====================================================
            // BUILD ORDER ITEMS
            // ====================================================

            const orderItems = [];

            let totalAmount = 0;


            for (
                const [cartItemId, quantityValue]
                of Object.entries(cart)
            ) {

                const quantity =
                    Number(quantityValue);


                /*
                 * IMPORTANT:
                 *
                 * Match ONLY against
                 * Firestore document.id.
                 */

                const item =
                    menuItems.find(
                        menuItem =>
                            menuItem.id ===
                            cartItemId
                    );


                if (!item) {

                    throw new Error(
                        "One of the selected food items is no longer available."
                    );

                }


                if (quantity <= 0) {

                    continue;

                }


                // =================================================
                // STOCK CHECK
                // =================================================

                if (
                    item.count > 0 &&
                    quantity > item.count
                ) {

                    throw new Error(
                        item.name +
                        " has only " +
                        item.count +
                        " available."
                    );

                }


                const itemTotal =
                    item.price *
                    quantity;


                totalAmount +=
                    itemTotal;


                orderItems.push({

                    itemId:
                        item.id,

                    name:
                        item.name,

                    quantity:
                        quantity,

                    price:
                        item.price

                });

            }


            if (
                orderItems.length === 0
            ) {

                throw new Error(
                    "No valid items found in your cart."
                );

            }


            // ====================================================
            // GENERATE ORDER ID
            // ====================================================

            const orderId =
                generateOrderId();


            const timestamp =
                Date.now();


            // ====================================================
            // ORDER OBJECT
            // ====================================================

            const order = {

                orderId:
                    orderId,

                tableId:
                    "table_" +
                    tableNumber,

                tableNumber:
                    Number(tableNumber),

                items:
                    orderItems,

                totalAmount:
                    totalAmount,

                status:
                    "NEW",

                orderType:
                    "DINE_IN",

                createdAt:
                    timestamp,

                updatedAt:
                    timestamp

            };


            // ====================================================
            // SAVE ORDER
            // ====================================================

            await setDoc(

                doc(
                    db,
                    "restaurants",
                    restaurantId,
                    "orders",
                    orderId
                ),

                order

            );


            // ====================================================
            // SAVE LOCAL ORDER
            // ====================================================

            localStorage.removeItem(
                "tableTapCart"
            );


            localStorage.setItem(
                "tableTapLastOrderId",
                orderId
            );


            localStorage.setItem(
                "tableTapOrder",
                JSON.stringify(order)
            );


            // ====================================================
            // SHOW SUCCESS
            // ====================================================

            showSuccess(
                orderId,
                orderItems,
                totalAmount
            );


        } catch (e) {

            console.error(
                "Order placement error:",
                e
            );


            showError(
                e.message ||
                "Something went wrong while placing your order."
            );

        }

    }


    // ============================================================
    // GENERATE ORDER ID
    // ============================================================

    function generateOrderId() {

        const letters =
            "ABCDEFGHJKLMNPQRTUVWXYZ";


        const randomLetter =
            letters[
                Math.floor(
                    Math.random() *
                    letters.length
                )
            ];


        const randomNumber =
            Math.floor(
                Math.random() * 900
            ) + 100;


        return (
            "TK-" +
            randomLetter +
            randomNumber
        );

    }


    // ============================================================
    // SHOW SUCCESS
    // ============================================================

    function showSuccess(
        orderId,
        orderItems,
        totalAmount
    ) {

        loading.style.display =
            "none";


        success.style.display =
            "block";


        document.getElementById(
            "order-id"
        ).textContent =
            orderId;


        document.getElementById(
            "total"
        ).textContent =
            "₹" + totalAmount;


        const orderItemsContainer =
            document.getElementById(
                "order-items"
            );


        orderItemsContainer.innerHTML =
            "";


        orderItems.forEach(
            (item) => {

                const itemContainer =
                    document.createElement(
                        "div"
                    );


                itemContainer.className =
                    "order-item";


                const left =
                    document.createElement(
                        "div"
                    );


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "order-item-name";


                name.textContent =
                    item.name;


                const quantity =
                    document.createElement(
                        "div"
                    );


                quantity.className =
                    "order-item-quantity";


                quantity.textContent =
                    "Quantity: " +
                    item.quantity;


                left.appendChild(
                    name
                );


                left.appendChild(
                    quantity
                );


                const price =
                    document.createElement(
                        "div"
                    );


                price.className =
                    "order-item-price";


                price.textContent =
                    "₹" +
                    (
                        item.price *
                        item.quantity
                    );


                itemContainer.appendChild(
                    left
                );


                itemContainer.appendChild(
                    price
                );


                orderItemsContainer.appendChild(
                    itemContainer
                );

            }
        );


        // ORDER MORE FOOD

        document.getElementById(
            "order-more-button"
        ).href =
            "menu.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId
            ) +
            "&tableNumber=" +
            encodeURIComponent(
                tableNumber
            );


        // BACK HOME

        document.getElementById(
            "back-home-button"
        ).href =
            "index.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId
            ) +
            "&tableNumber=" +
            encodeURIComponent(
                tableNumber
            );

    }


    // ============================================================
    // SHOW ERROR
    // ============================================================

    function showError(message) {

        loading.style.display =
            "none";


        success.style.display =
            "none";


        error.style.display =
            "block";


        errorMessage.textContent =
            message;


        document.getElementById(
            "back-cart-button"
        ).href =
            "cart.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId || ""
            ) +
            "&tableNumber=" +
            encodeURIComponent(
                tableNumber || ""
            );

    }

</script>

</body>

</html>
